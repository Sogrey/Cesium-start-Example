// ================================================================
//  2. 扩散圆效果类（平行地面，不被遮挡）
// ================================================================

class ExpandingCircleEffect {
  constructor(viewer) {
    this._viewer = viewer;
    this._effects = [];
    this._counter = 0;
    this._circleMarkers = [];
  }

  add(options) {
    if (!options || !options.position) {
      console.error('需要提供 position 参数');
      return null;
    }

    const that = this;
    const effectId = options.id || 'ExpandingCircle_' + (++this._counter);
    const centerPosition = options.position;
    const maxRadius = options.radius || 500;
    const circleColor = options.color || Cesium.Color.RED;
    const animationDuration = options.duration || 2000;
    const edgeSmoothness = options.border || 4.0;

    const centerCartesian3 = centerPosition;
    const centerCartesian4 = new Cesium.Cartesian4(
      centerCartesian3.x,
      centerCartesian3.y,
      centerCartesian3.z,
      1
    );

    // 中心点上方500米（用于计算法线方向）
    const wgs84 = this._cartesianToWGS84(centerPosition);
    const aboveCenterCartesian3 = Cesium.Cartesian3.fromDegrees(
      wgs84.lng,
      wgs84.lat,
      wgs84.alt + 500
    );
    const aboveCenterCartesian4 = new Cesium.Cartesian4(
      aboveCenterCartesian3.x,
      aboveCenterCartesian3.y,
      aboveCenterCartesian3.z,
      1
    );

    const startTime = new Date().getTime();

    const borderPower = edgeSmoothness;

    // 【关键修复】平行地面的扩散圆
    const fragmentShader = `
                    uniform sampler2D colorTexture;
                    uniform sampler2D depthTexture;
                    in vec2 v_textureCoordinates;
                    uniform vec4 u_centerEC;
                    uniform vec3 u_planeNormalEC;
                    uniform float u_radius;
                    uniform vec4 u_color;
                    out vec4 fragColor;

                    // 屏幕坐标 → 相机坐标
                    vec4 screenToEye(in vec2 uv, in float depth) {
                        vec2 clipXY = vec2((uv.x * 2.0 - 1.0), (uv.y * 2.0 - 1.0));
                        vec4 eyePos = czm_inverseProjection * vec4(clipXY, depth, 1.0);
                        eyePos = eyePos / eyePos.w;
                        return eyePos;
                    }

                    // 深度解码
                    float unpackDepthValue(in vec4 depth) {
                        float z_window = czm_unpackDepth(depth);
                        z_window = czm_reverseLogDepth(z_window);
                        float n_range = czm_depthRange.near;
                        float f_range = czm_depthRange.far;
                        return (2.0 * z_window - n_range - f_range) / (f_range - n_range);
                    }

                    void main() {
                        // 获取原始场景颜色
                        fragColor = texture(colorTexture, v_textureCoordinates);

                        // 获取真实深度
                        float depth = unpackDepthValue(texture(depthTexture, v_textureCoordinates));

                        // 如果深度无效（天空）则跳过
                        if (depth > 0.999) return;

                        // 计算像素在相机坐标系中的位置
                        vec4 viewPos = screenToEye(v_textureCoordinates, depth);

                        // 计算从中心到像素的向量
                        vec3 dir = viewPos.xyz - u_centerEC.xyz;

                        // 【关键】计算到中心平面的距离（平行于地面）
                        // 使用法线方向投影，得到垂直距离
                        float distToPlane = dot(dir, u_planeNormalEC);

                        // 计算水平距离（平行于地面的距离）
                        vec3 horizontalDir = dir - distToPlane * u_planeNormalEC;
                        float horizontalDist = length(horizontalDir);

                        // 半径判断：水平距离 < 半径
                        if (horizontalDist < u_radius) {
                            // 强度：中心最强，边缘渐弱
                            float intensity = 1.0 - abs(u_radius - horizontalDist) / u_radius;
                            intensity = pow(intensity, float(${borderPower}));

                            // 平滑混合
                            fragColor = mix(fragColor, u_color, intensity * 0.85);
                            // 边缘发光增强
                            fragColor.rgb += u_color.rgb * intensity * 0.2;
                        }
                    }
                `;

    const postProcessStage = new Cesium.PostProcessStage({
      name: effectId,
      fragmentShader: fragmentShader,
      uniforms: {
        u_centerEC: function() {
          return Cesium.Matrix4.multiplyByVector(
            that._viewer.camera._viewMatrix,
            centerCartesian4,
            new Cesium.Cartesian4()
          );
        },
        u_planeNormalEC: function() {
          const centerInEye = Cesium.Matrix4.multiplyByVector(
            that._viewer.camera._viewMatrix,
            centerCartesian4,
            new Cesium.Cartesian4()
          );
          const aboveInEye = Cesium.Matrix4.multiplyByVector(
            that._viewer.camera._viewMatrix,
            aboveCenterCartesian4,
            new Cesium.Cartesian4()
          );
          const normal = new Cesium.Cartesian3(
            aboveInEye.x - centerInEye.x,
            aboveInEye.y - centerInEye.y,
            aboveInEye.z - centerInEye.z
          );
          return Cesium.Cartesian3.normalize(normal, normal);
        },
        u_radius: function() {
          const elapsed = (new Date().getTime() - startTime) % animationDuration;
          return (maxRadius * elapsed) / animationDuration;
        },
        u_color: circleColor
      }
    });

    this._viewer.scene.postProcessStages.add(postProcessStage);

    // 添加标记点
    const marker = this._viewer.entities.add({
      position: centerPosition,
      point: {
        pixelSize: 10,
        color: circleColor,
        outlineColor: Cesium.Color.WHITE,
        outlineWidth: 2,
        heightReference: Cesium.HeightReference.NONE
      },
      label: {
        text: '📍 扩散中心',
        font: '13px sans-serif',
        fillColor: Cesium.Color.WHITE,
        outlineColor: Cesium.Color.BLACK,
        outlineWidth: 2,
        pixelOffset: new Cesium.Cartesian2(0, -25),
        showBackground: true,
        backgroundColor: Cesium.Color.BLACK.withAlpha(0.6),
        backgroundPadding: new Cesium.Cartesian2(8, 4)
      }
    });

    const effectData = {
      stage: postProcessStage,
      marker: marker,
      id: effectId,
      position: centerPosition,
      color: circleColor,
      radius: maxRadius,
      duration: animationDuration,
      border: edgeSmoothness,
      startTime: startTime
    };
    this._effects.push(effectData);
    this._circleMarkers.push(marker);

    console.log('✅ 添加扩散圆: ' + effectId);
    return postProcessStage;
  }

  clearAll() {
    this._effects.forEach(effect => {
      this._viewer.scene.postProcessStages.remove(effect.stage);
      if (effect.marker) {
        this._viewer.entities.remove(effect.marker);
      }
    });
    this._effects = [];
    this._circleMarkers = [];
    this._counter = 0;
    console.log('🗑 已清除所有扩散圆');
  }

  getCount() {
    return this._effects.length;
  }

  getEffects() {
    return this._effects;
  }

  _cartesianToWGS84(cartesian) {
    const cartographic = Cesium.Cartographic.fromCartesian(cartesian);
    return {
      lng: Cesium.Math.toDegrees(cartographic.longitude),
      lat: Cesium.Math.toDegrees(cartographic.latitude),
      alt: cartographic.height
    };
  }
}

// ================================================================
//  3. 实例化与UI绑定
// ================================================================

const expandingCircle = new ExpandingCircleEffect(viewer);

let circleCount = 0;
const circleCountEl = document.getElementById('circleCount');
const currentPresetEl = document.getElementById('currentPreset');

function updateStatus(name) {
  circleCountEl.textContent = expandingCircle.getCount();
  currentPresetEl.textContent = name ? ' | ' + name : '';
}

function getParams() {
  const color = document.getElementById('colorPicker').value;
  const speed = parseFloat(document.getElementById('speedSlider').value);
  const radius = parseFloat(document.getElementById('radiusSlider').value);
  const border = parseFloat(document.getElementById('borderSlider').value);
  const height = parseFloat(document.getElementById('heightSlider').value);
  return {
    color,
    speed,
    radius,
    border,
    height
  };
}

// ---- 添加扩散圆 ----
function addCircle() {
  const params = getParams();

  const centerLng = 116.3974;
  const centerLat = 39.9093;
  const lng = centerLng + (Math.random() - 0.5) * 0.015;
  const lat = centerLat + (Math.random() - 0.5) * 0.015;

  // 高度由滑块控制
  const position = Cesium.Cartesian3.fromDegrees(lng, lat, params.height);
  const color = Cesium.Color.fromCssColorString(params.color);

  expandingCircle.add({
    position: position,
    color: color,
    radius: params.radius,
    duration: 2000 / params.speed,
    border: params.border
  });

  updateStatus('扩散圆 #' + (++circleCount));
}

function clearAll() {
  expandingCircle.clearAll();
  circleCount = 0;
  updateStatus();
}

document.getElementById('addBtn').addEventListener('click', addCircle);
document.getElementById('clearBtn').addEventListener('click', clearAll);

document.getElementById('speedSlider').addEventListener('input', function() {
  const val = parseFloat(this.value);
  document.getElementById('speedValue').textContent = val.toFixed(1);
  const effects = expandingCircle.getEffects();
  effects.forEach(effect => {
    effect.duration = 2000 / val;
    effect.startTime = new Date().getTime();
  });
});

document.getElementById('radiusSlider').addEventListener('input', function() {
  document.getElementById('radiusValue').textContent = this.value;
});

document.getElementById('borderSlider').addEventListener('input', function() {
  document.getElementById('borderValue').textContent = parseFloat(this.value).toFixed(1);

document.getElementById('heightSlider').addEventListener('input', function() {
