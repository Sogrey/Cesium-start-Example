<script>
// ================================================================

// ================================================================
//  2. 初始化主地图 (带真实地形) - 修复 createWorldTerrain 错误
// ================================================================

// 【方法一】使用 Cesium 官方地形服务 (推荐)
// 注意：Cesium 1.120 版本中，createWorldTerrain 已被移除，
// 应使用 Cesium.createWorldTerrainAsync() 或直接创建 TerrainProvider

} catch (e) {

// 创建 Viewer

  baseLayer: false,
  geocoder: true,
  homeButton: true,
  sceneModePicker: true,
  navigationHelpButton: true,
  animation: true,
  timeline: true,

  infoBox: true,

// 隐藏版权
if (viewer.cesiumWidget.creditContainer) {
  viewer.cesiumWidget.creditContainer.style.display = 'none';

// 添加高德影像底图
try {
  const gaodeImagery = new Cesium.UrlTemplateImageryProvider({
    url: 'https://webst01.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',
    subdomains: ['01', '02', '03', '04'],
    maximumLevel: 18,
    credit: new Cesium.Credit('高德地图')
  });
  viewer.imageryLayers.addImageryProvider(gaodeImagery);
} catch (e) {
  console.warn('高德地图加载失败', e);
}

// 设置初始视角 - 选择有地形起伏的区域（四川阿坝州附近）
viewer.camera.setView({
  destination: Cesium.Cartesian3.fromDegrees(102.5, 32.5, 8000),
  orientation: {
    heading: Cesium.Math.toRadians(20),
    pitch: Cesium.Math.toRadians(-40),
    roll: 0
  }
});

// ================================================================
//  3. 坐标转换辅助类 (支持地形拾取)
// ================================================================
class CoordinateTransform {
  constructor(viewer) {
    this._viewer = viewer;
  }

  // 从屏幕坐标获取三维笛卡尔坐标 (优先拾取地形)
  getCartesian3FromPX(windowPosition) {
    const ray = this._viewer.camera.getPickRay(windowPosition);
    if (!ray) return null;

    // 1. 优先拾取地形
    let position = this._viewer.scene.globe.pick(ray, this._viewer.scene);
    if (position) return position;

    // 2. 拾取模型
    const picked = this._viewer.scene.pick(windowPosition);
    if (picked && picked.primitive) {
      const cartesian = this._viewer.scene.pickPosition(windowPosition);
      if (cartesian) return cartesian;
    }

    // 3. 降级：椭球面
    return this._viewer.scene.camera.pickEllipsoid(windowPosition);
  }

  transformWGS84ToCartographic(cartesian) {
    return Cesium.Cartographic.fromCartesian(cartesian);
  }

  transformCartesianArrayToWGS84Array(cartesianArray) {
    return cartesianArray.map(c => {
      const carto = Cesium.Cartographic.fromCartesian(c);
      return {
        longitude: Cesium.Math.toDegrees(carto.longitude),
        latitude: Cesium.Math.toDegrees(carto.latitude),
        height: carto.height
      };
    });
  }
}

const coordTransform = new CoordinateTransform(viewer);

// ================================================================
//  4. 三角测量核心类
// ================================================================
class TriangleMeasure {
  constructor(viewer, options = {}) {
    this._viewer = viewer;
    this._coordTransform = options.coordinateTransform || null;
    this._drawLayer = new Cesium.CustomDataSource('triangleMeasureLayer');
    viewer.dataSources.add(this._drawLayer);
    this._handler = null;
    this._isMeasuring = false;
    this._measureHistory = [];
    this._currentDynamicEntities = null;
    this._style = options.style || {
      width: 3,
      material: Cesium.Color.BLUE.withAlpha(0.6)
    };
  }

  getPositionDistance(positions) {
    if (!positions || positions.length < 2) return 0;
    let distance = 0;
    for (let i = 0; i < positions.length - 1; i++) {
      const p1 = Cesium.Cartographic.fromCartesian(positions[i]);
      const p2 = Cesium.Cartographic.fromCartesian(positions[i + 1]);
      const geodesic = new Cesium.EllipsoidGeodesic();
      geodesic.setEndPoints(p1, p2);
      let s = geodesic.surfaceDistance;
      s = Math.sqrt(Math.pow(s, 2) + Math.pow(p2.height - p1.height, 2));
      distance += s;
    }
    return distance;
  }

  getHeightDiff(pos1, pos2) {
    if (!pos1 || !pos2) return 0;
    const c1 = Cesium.Cartographic.fromCartesian(pos1);
    const c2 = Cesium.Cartographic.fromCartesian(pos2);
    return c2.height - c1.height;
  }

  computeHorizontalPoint(pos1, pos2) {
    const c1 = Cesium.Cartographic.fromCartesian(pos1);
    const c2 = Cesium.Cartographic.fromCartesian(pos2);
    return Cesium.Cartesian3.fromDegrees(
      Cesium.Math.toDegrees(c1.longitude),
      Cesium.Math.toDegrees(c1.latitude),
      c2.height
    );
  }

  destroyHandler() {
    if (this._handler) {
      this._handler.destroy();
      this._handler = null;
    }
  }

  createEntity() {
    return new Cesium.Entity();
  }

  startMeasure(options = {}) {
    if (this._isMeasuring) return;
    if (!this._viewer) return;

    options = options || {};
    const that = this;

    let positions = [];
    let tempPoints = [];
    let tempPoints2 = [];

    this.destroyHandler();
    this._handler = new Cesium.ScreenSpaceEventHandler(this._viewer.scene.canvas);
    this._isMeasuring = true;

    const createDynamicEntities = () => {
      const slantEntity = that.createEntity();
      const heightEntity = that.createEntity();
      const horizEntity = that.createEntity();

      slantEntity.polyline = {
        positions: new Cesium.CallbackProperty(() => positions, false),
        ...that._style
      };
      slantEntity.position = new Cesium.CallbackProperty(() => positions[0] || Cesium.Cartesian3.ZERO,
        false);
      slantEntity.point = {
        pixelSize: 8,
        color: Cesium.Color.RED,
        outlineColor: Cesium.Color.WHITE,
        outlineWidth: 2
      };
      slantEntity.label = {
        text: new Cesium.CallbackProperty(() => {
          if (positions.length < 2) return '点击起点';
          const dist = that.getPositionDistance(positions);
          return `斜距: ${dist.toFixed(2)} 米`;
        }, false),
        show: true,
        showBackground: true,
        backgroundColor: Cesium.Color.BLACK.withAlpha(0.7),
        font: 'bold 14px monospace',
        fillColor: Cesium.Color.YELLOW,
        horizontalOrigin: Cesium.HorizontalOrigin.LEFT,
        verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
        pixelOffset: new Cesium.Cartesian2(16, -24)
      };

      heightEntity.polyline = {
        positions: new Cesium.CallbackProperty(() => tempPoints, false),
        width: 2,
        material: Cesium.Color.RED.withAlpha(0.7),
        dashLength: 8
      };
      heightEntity.position = new Cesium.CallbackProperty(() =>
        tempPoints[1] || Cesium.Cartesian3.ZERO, false
      );
      heightEntity.point = {
        pixelSize: 6,
        color: Cesium.Color.GREEN,
        outlineColor: Cesium.Color.WHITE,
        outlineWidth: 2
      };
      heightEntity.label = {
        text: new Cesium.CallbackProperty(() => {
          if (positions.length < 2) return '';
          const diff = that.getHeightDiff(positions[0], positions[1]);
          return `高差: ${diff.toFixed(2)} 米`;
        }, false),
        show: true,
        showBackground: true,
        backgroundColor: Cesium.Color.BLACK.withAlpha(0.7),
        font: 'bold 13px monospace',
        fillColor: Cesium.Color.LIME,
        horizontalOrigin: Cesium.HorizontalOrigin.LEFT,
        verticalOrigin: Cesium.VerticalOrigin.TOP,
        pixelOffset: new Cesium.Cartesian2(-20, 10)
      };

      horizEntity.polyline = {
        positions: new Cesium.CallbackProperty(() => tempPoints2, false),
        width: 2,
        material: Cesium.Color.GREEN.withAlpha(0.6),
        dashLength: 10
      };
      horizEntity.position = new Cesium.CallbackProperty(() =>
        positions[1] || Cesium.Cartesian3.ZERO, false
      );
      horizEntity.point = {
        pixelSize: 6,
        color: Cesium.Color.BLUE,
        outlineColor: Cesium.Color.WHITE,
        outlineWidth: 2
      };
      horizEntity.label = {
        text: new Cesium.CallbackProperty(() => {
          if (tempPoints2.length < 2) return '';
          const dist = that.getPositionDistance(tempPoints2);
          return `平距: ${dist.toFixed(2)} 米`;
        }, false),
        show: true,
        showBackground: true,
        backgroundColor: Cesium.Color.BLACK.withAlpha(0.7),
        font: 'bold 13px monospace',
        fillColor: Cesium.Color.CYAN,
        horizontalOrigin: Cesium.HorizontalOrigin.RIGHT,
        verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
        pixelOffset: new Cesium.Cartesian2(-10, -10)
      };

      that._drawLayer.entities.add(slantEntity);
      that._drawLayer.entities.add(heightEntity);
      that._drawLayer.entities.add(horizEntity);

      return {
        slantEntity,
        heightEntity,
        horizEntity
      };
    };

    const createStaticEntities = (pos, temp1, temp2, index) => {
      const slantDist = that.getPositionDistance(pos);
      const heightDiff = that.getHeightDiff(pos[0], pos[1]);
      const horizDist = that.getPositionDistance(temp2);

      const sEntity = that.createEntity();
      sEntity.polyline = {
        positions: pos.slice(),
        ...that._style
      };
      sEntity.position = pos[0];
      sEntity.point = {
        pixelSize: 8,
        color: Cesium.Color.RED,
        outlineColor: Cesium.Color.WHITE,
        outlineWidth: 2
      };
      sEntity.label = {
        text: `斜距 #${index}: ${slantDist.toFixed(2)} 米`,
        show: true,
        showBackground: true,
        backgroundColor: Cesium.Color.BLACK.withAlpha(0.7),
        font: 'bold 13px monospace',
        fillColor: Cesium.Color.YELLOW,
        horizontalOrigin: Cesium.HorizontalOrigin.LEFT,
        verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
        pixelOffset: new Cesium.Cartesian2(16, -24)
      };

      const hEntity = that.createEntity();
      hEntity.polyline = {
        positions: temp1.slice(),
        width: 2,
        material: Cesium.Color.RED.withAlpha(0.5),
        dashLength: 8
      };
      hEntity.position = temp1[1];
      hEntity.point = {
        pixelSize: 6,
        color: Cesium.Color.GREEN,
        outlineColor: Cesium.Color.WHITE,
        outlineWidth: 2
      };
      hEntity.label = {
        text: `高差 #${index}: ${heightDiff.toFixed(2)} 米`,
        show: true,
        showBackground: true,
        backgroundColor: Cesium.Color.BLACK.withAlpha(0.7),
        font: 'bold 13px monospace',
        fillColor: Cesium.Color.LIME,
        horizontalOrigin: Cesium.HorizontalOrigin.LEFT,
        verticalOrigin: Cesium.VerticalOrigin.TOP,
        pixelOffset: new Cesium.Cartesian2(-20, 10)
      };

      const hzEntity = that.createEntity();
      hzEntity.polyline = {
        positions: temp2.slice(),
        width: 2,
        material: Cesium.Color.GREEN.withAlpha(0.5),
        dashLength: 10
      };
      hzEntity.position = pos[1];
      hzEntity.point = {
        pixelSize: 6,
        color: Cesium.Color.BLUE,
        outlineColor: Cesium.Color.WHITE,
        outlineWidth: 2
      };
      hzEntity.label = {
        text: `平距 #${index}: ${horizDist.toFixed(2)} 米`,
        show: true,
        showBackground: true,
        backgroundColor: Cesium.Color.BLACK.withAlpha(0.7),
        font: 'bold 13px monospace',
        fillColor: Cesium.Color.CYAN,
        horizontalOrigin: Cesium.HorizontalOrigin.RIGHT,
        verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
        pixelOffset: new Cesium.Cartesian2(-10, -10)
      };

      that._drawLayer.entities.add(sEntity);
      that._drawLayer.entities.add(hEntity);
      that._drawLayer.entities.add(hzEntity);
    };

    this._currentDynamicEntities = createDynamicEntities();

    this._handler.setInputAction((movement) => {
      const cartesian = that._coordTransform ?
        that._coordTransform.getCartesian3FromPX(movement.position) :
        viewer.camera.pickEllipsoid(movement.position);

      if (!cartesian) return;

      if (positions.length === 0) {
        positions.push(cartesian.clone());
        positions.push(cartesian.clone());
        tempPoints.push(cartesian.clone());
        tempPoints.push(cartesian.clone());
        tempPoints2.push(cartesian.clone());
        tempPoints2.push(cartesian.clone());
      } else {
        const result = {
          slantRange: that.getPositionDistance(positions),
          height: that.getHeightDiff(positions[0], positions[1]),
          horizontalDistance: that.getPositionDistance(tempPoints2)
        };

        const index = that._measureHistory.length + 1;
        createStaticEntities(
          positions.map(p => p.clone()),
          tempPoints.map(p => p.clone()),
          tempPoints2.map(p => p.clone()),
          index
        );

        that._measureHistory.push({
          ...result,
          positions: positions.map(p => p.clone())
        });

        if (typeof options.callback === 'function') {
          options.callback(result, that._measureHistory.length);
        }

        positions = [];
        tempPoints = [];
        tempPoints2 = [];
      }
    }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

    this._handler.setInputAction((movement) => {
      const cartesian = that._coordTransform ?
        that._coordTransform.getCartesian3FromPX(movement.endPosition) :
        viewer.camera.pickEllipsoid(movement.endPosition);

      if (!cartesian || positions.length === 0) return;

      positions.pop();
      positions.push(cartesian.clone());

      const horiz = that.computeHorizontalPoint(positions[0], positions[1]);

      tempPoints.pop();
      tempPoints.push(horiz.clone());

      tempPoints2.pop();
      tempPoints2.pop();
      tempPoints2.push(cartesian.clone());
      tempPoints2.push(horiz.clone());

    }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);
  }

  stopMeasure() {
    this.destroyHandler();
    this._isMeasuring = false;
    this._currentDynamicEntities = null;
  }

  clearMeasure() {
    this.destroyHandler();
    this._isMeasuring = false;
    this._currentDynamicEntities = null;
    this._measureHistory = [];
    if (this._drawLayer) {
      this._drawLayer.entities.removeAll();
    }
  }

  isMeasuring() {
    return this._isMeasuring;
  }

  getMeasureHistory() {
    return this._measureHistory;
  }

  getLatestMeasureResult() {
    if (this._measureHistory.length === 0) return null;
    return this._measureHistory[this._measureHistory.length - 1];
  }

  getMeasureCount() {
    return this._measureHistory.length;
  }

  destroy() {
    this.stopMeasure();
    if (this._drawLayer) {
      this._viewer.dataSources.remove(this._drawLayer);
    }
  }
}

// ================================================================
//  5. 实例化并绑定 UI
// ================================================================

const triangleMeasure = new TriangleMeasure(viewer, {
  coordinateTransform: coordTransform,
  style: {
    width: 3,
    material: Cesium.Color.BLUE.withAlpha(0.6)
  }
});

const startBtn = document.getElementById('startBtn');
const clearBtn = document.getElementById('clearBtn');
const exportBtn = document.getElementById('exportBtn');
const measureContent = document.getElementById('measureContent');
const hint = document.getElementById('hint');
const terrainStatus = document.getElementById('terrainStatus');

function updateMeasureDisplay(result, count) {
  if (result) {
    measureContent.innerHTML = `
                        <div class="row"><span class="label">📏 斜距</span><span class="value slant">${result.slantRange.toFixed(2)} 米</span></div>
                        <div class="row"><span class="label">📐 高差</span><span class="value height">${result.height.toFixed(2)} 米</span></div>
                        <div class="row"><span class="label">📊 平距</span><span class="value horiz">${result.horizontalDistance.toFixed(2)} 米</span></div>
                        <div class="row" style="margin-top:6px;border-top:1px solid rgba(255,255,255,0.06);padding-top:6px;">
                            <span class="label">📋 测量次数</span>
                            <span class="value count">${count}</span>
                        </div>
                    `;
  } else {
    measureContent.innerHTML = `
                        <div class="empty">暂无测量数据<br>点击「开始测量」后在地图上点击两个点</div>
                    `;
  }
}

startBtn.addEventListener('click', function() {
  if (triangleMeasure.isMeasuring()) {
    triangleMeasure.stopMeasure();
    this.classList.remove('active');
    this.innerHTML = '▶ 开始测量';
    hint.classList.remove('hidden');
    hint.textContent = '💡 已暂停测量，点击「开始测量」继续';
  } else {
    triangleMeasure.startMeasure({
      callback: function(result, count) {
        updateMeasureDisplay(result, count);
        hint.textContent = '✅ 测量完成！继续点击下一个点...';
        hint.classList.remove('hidden');
        setTimeout(() => {
          hint.textContent = '💡 点击第一个点 → 移动预览 → 点击第二个点完成';
        }, 1500);
      }
    });
    this.classList.add('active');
    this.innerHTML = '⏹ 停止测量';
    hint.classList.remove('hidden');
    hint.textContent = '💡 点击第一个点 → 移动鼠标预览 → 点击第二个点完成测量';
  }
});

clearBtn.addEventListener('click', function() {
  triangleMeasure.clearMeasure();
  startBtn.classList.remove('active');
  startBtn.innerHTML = '▶ 开始测量';
  updateMeasureDisplay(null, 0);
  hint.classList.remove('hidden');
  hint.textContent = '🗑 已清除所有测量数据';
  setTimeout(() => {
    hint.textContent = '💡 点击「开始测量」后在地图上点击两个点';
  }, 1500);
});

exportBtn.addEventListener('click', function() {
  const history = triangleMeasure.getMeasureHistory();
  if (history.length === 0) {
    alert('暂无测量数据可导出');
    return;
  }

  const data = {
    exportTime: new Date().toISOString(),
    totalCount: history.length,
    measurements: history.map((item, idx) => ({
      index: idx + 1,
      slantRange: parseFloat(item.slantRange.toFixed(2)),
      height: parseFloat(item.height.toFixed(2)),
      horizontalDistance: parseFloat(item.horizontalDistance.toFixed(2))
    }))
  };

  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], {
    type: 'application/json'
  });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `三角测量数据_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);

  hint.textContent = `📥 已导出 ${history.length} 条测量数据`;
  hint.classList.remove('hidden');
  setTimeout(() => {
    hint.textContent = '💡 点击「开始测量」后在地图上点击两个点';
  }, 2000);
});

updateMeasureDisplay(null, 0);

window.addEventListener('resize', () => {
  viewer.resize();
});

console.log('✅ Cesium 三角测量工具已加载');
console.log('📌 地形状态:', terrainStatus.textContent);
console.log('📊 支持斜距、高差、平距三种测量值');
</script>
