// ================================================================
//  1. 初始化主地图

const viewer = new Cesium.Viewer('cesiumContainer', {

// ================================================================
//  2. 贝塞尔曲线算法（原文 setPathData）
// ================================================================

// 组合数计算
function erxiangshi(start, end) {
  let cs = 1,
    bcs = 1;
  while (end > 0) {
    cs *= start;
    bcs *= end;
    start--;
    end--;
  }
  return cs / bcs;
}

// 多点贝塞尔
function multiPointBezier(points, t) {
  let len = points.length;
  let x = 0,
    y = 0;
  for (let i = 0; i < len; i++) {
    let point = points[i];
    x += point.x * Math.pow(1 - t, len - 1 - i) * Math.pow(t, i) * erxiangshi(len - 1, i);
    y += point.y * Math.pow(1 - t, len - 1 - i) * Math.pow(t, i) * erxiangshi(len - 1, i);
  }
  return {
    x: x,
    y: y
  };
}

// 创建贝塞尔点集
function createBezierPoints(anchorpoints, pointsAmount) {
  let points = [];
  for (let i = 0; i < pointsAmount; i++) {
    let point = multiPointBezier(anchorpoints, i / pointsAmount);
    points.push([point.x, point.y]);
  }
  return points;
}

// 获取贝塞尔曲线路径点（经纬度）
function getBSRPoints(x1, y1, x2, y2, h) {
  let pointStart = [y1, 0];
  let pointEnd = [(y2 + y1) / 2, h];
  let point3 = [y2, 0];
  let ps = [{
      x: pointStart[0],
      y: pointStart[1]
    },
    {
      x: pointEnd[0],
      y: pointEnd[1]
    },
    {
      x: point3[0],
      y: point3[1]
    }
  ];
  let arr = createBezierPoints(ps, 100);

  let arr3d = [];
  for (let i = 0; i < arr.length; i++) {
    let x = ((x2 - x1) * (arr[i][0] - y1)) / (y2 - y1) + x1;
    arr3d.push([x, arr[i][0], arr[i][1]]);
  }
  return arr3d;
}

// 转换为 Cesium.Cartesian3 数组
function setPathData(startLon, startLat, endLon, endLat, height) {
  let arr3d = getBSRPoints(startLon, startLat, endLon, endLat, height);
  let arrAll = [];
  for (let ite of arr3d) {
    arrAll.push(ite[0]);
    arrAll.push(ite[1]);
    arrAll.push(ite[2]);
  }
  return Cesium.Cartesian3.fromDegreesArrayHeights(arrAll);
}

// ================================================================
//  3. GLSL 着色器（原文 FlowingLineMaterialGLSL）
// ================================================================

const FlowingLineMaterialGLSL =
  'float SPEED_STEP = 0.01; \n' +
  'vec4 drawLight(float xPos, vec2 st, float headOffset, float tailOffset, float widthOffset){ \n' +
  '  float lineLength = smoothstep(xPos + headOffset, xPos, st.x) - smoothstep(xPos, xPos - tailOffset, st.x); \n' +
  '  float lineWidth = smoothstep(widthOffset, 0.5, st.y) - smoothstep(0.5, 1.0 - widthOffset, st.y); \n' +
  '  return vec4(lineLength * lineWidth); \n' +
  '}\n' +
  'czm_material czm_getMaterial(czm_materialInput materialInput) \n' +
  '{ \n' +
  '  czm_material m = czm_getDefaultMaterial(materialInput);\n' +
  '  float sinTime = sin(czm_frameNumber * SPEED_STEP * speed); \n' +
  '  vec4 v4_core;\n' +
  '  vec4 v4_color;\n' +
  '  float xPos = 0.0; \n' +
  '  if (sinTime < 0.0){ \n' +
  '    xPos = cos(czm_frameNumber * SPEED_STEP * speed)+ 1.0 - tailsize; \n' +
  '  }else{ \n' +
  '    xPos = -cos(czm_frameNumber * SPEED_STEP * speed)+ 1.0 - tailsize; \n' +
  '  } \n' +
  '  v4_color = drawLight(xPos, materialInput.st, headsize, tailsize, widthoffset);\n' +
  '  v4_core = drawLight(xPos, materialInput.st, coresize, coresize*2.0, widthoffset*2.0);\n' +
  '  m.diffuse = color.xyz + v4_core.xyz*v4_core.w*0.8; \n' +
  '  m.alpha = pow(v4_color.w, 3.0); \n' +
  '  return m; \n' +
  '} \n';

// ================================================================
//  4. 飞线管理
// ================================================================

let primitives = [];
let lineCount = 0;
let firstFly = true;
const lineCountEl = document.getElementById('lineCount');
const currentPresetEl = document.getElementById('currentPreset');

function updateStatus(presetName) {
  lineCountEl.textContent = lineCount;
  currentPresetEl.textContent = presetName ? ' | ' + presetName : '';
}

function getParams() {
  return {
    color: document.getElementById('colorPicker').value,
    speed: parseFloat(document.getElementById('speedSlider').value),
    width: parseInt(document.getElementById('widthSlider').value)
  };
}

// ================================================================
//  4.1 添加飞线（原文方式）
// ================================================================

function addFlowLine() {
  const params = getParams();

  // 广州 → 深圳
  const positions = setPathData(113.17, 23.8, 114.0, 22.5, 80000);

  // ---- 创建飞线材质 ----
  const color = Cesium.Color.fromCssColorString(params.color);

  const material = new Cesium.Material({
    fabric: {
      type: 'FlowingLineMaterial',
      uniforms: {
        color: color,
        speed: params.speed * 1.5,
        headsize: 0.05,
        tailsize: 0.5,
        widthoffset: 0.1,
        coresize: 0.05
      },
      source: FlowingLineMaterialGLSL
    }
  });

  // ---- 创建飞线 Primitive ----
  const primitive = new Cesium.Primitive({
    geometryInstances: new Cesium.GeometryInstance({
      geometry: new Cesium.PolylineGeometry({
        positions: positions,
        width: params.width,
        vertexFormat: Cesium.VertexFormat.ALL
      })
    }),
    appearance: new Cesium.PolylineMaterialAppearance({
      material: material,
      translucent: true
    })
  });

  viewer.scene.primitives.add(primitive);

  // 保存引用
  const item = {
    primitive: primitive,
    material: material,
    positions: positions,
    params: params
  };
  primitives.push(item);

  lineCount++;
  updateStatus('流动飞线');

  if (firstFly) {
    firstFly = false;
    const center = positions[Math.floor(positions.length / 2)];
    viewer.camera.flyTo({
      destination: center,
      orientation: {
        heading: Cesium.Math.toRadians(0),
        pitch: Cesium.Math.toRadians(-35),
        roll: 0
      },
      duration: 1.5,
      distance: 120000
    });
  }
}

// ================================================================
//  5. UI 事件绑定
// ================================================================

document.getElementById('addBtn').addEventListener('click', function() {
  addFlowLine();
});

document.getElementById('clearBtn').addEventListener('click', function() {
  primitives.forEach(item => {
    viewer.scene.primitives.remove(item.primitive);
  });
  primitives = [];
  lineCount = 0;
  firstFly = true;
  updateStatus();
});

// ---- 更新参数 ----
function updateAllLines() {
  const params = getParams();
  const color = Cesium.Color.fromCssColorString(params.color);

  const oldItems = primitives.slice();
  primitives = [];

  oldItems.forEach(item => {
    viewer.scene.primitives.remove(item.primitive);

    // 重新创建材质
    const newMaterial = new Cesium.Material({
      fabric: {
        type: 'FlowingLineMaterial',
        uniforms: {
          color: color,
          speed: params.speed * 1.5,
          headsize: 0.05,
          tailsize: 0.5,
          widthoffset: 0.1,
          coresize: 0.05
        },
        source: FlowingLineMaterialGLSL
      }
    });

    const newPrimitive = new Cesium.Primitive({
      geometryInstances: new Cesium.GeometryInstance({
        geometry: new Cesium.PolylineGeometry({
          positions: item.positions,
          width: params.width,
          vertexFormat: Cesium.VertexFormat.ALL
        })
      }),
      appearance: new Cesium.PolylineMaterialAppearance({
        material: newMaterial,
        translucent: true
      })
    });

    viewer.scene.primitives.add(newPrimitive);

    primitives.push({
      primitive: newPrimitive,
      material: newMaterial,
      positions: item.positions,
      params: params
    });
  });

  updateStatus('流动飞线');
}

document.getElementById('speedSlider').addEventListener('input', function() {
  document.getElementById('speedValue').textContent = parseFloat(this.value).toFixed(1);
  updateAllLines();
});

document.getElementById('widthSlider').addEventListener('input', function() {
  document.getElementById('widthValue').textContent = this.value;
  updateAllLines();
});

document.getElementById('colorPicker').addEventListener('input', function() {
  updateAllLines();
});

// ================================================================
//  6. 初始化示例
// ================================================================

setTimeout(() => {
  addFlowLine();
  setTimeout(() => {
    document.getElementById('colorPicker').value = '#ff6633';
    addFlowLine();
    document.getElementById('colorPicker').value = '#00ff88';
  }, 400);
}, 500);

window.addEventListener('resize', () => {
  viewer.resize();
});

console.log('✅ 流动飞线已加载（原文正确实现）');
console.log('📖 实现方式:');

</script>
