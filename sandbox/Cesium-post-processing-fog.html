// ================================================================
//  2. 雾效果类（基于 PostProcessStage）
// ================================================================
class FogEffect {
  constructor(viewer) {
    this._viewer = viewer;
    this._postProcessStage = null;
    this._isEnabled = false;

    // 默认参数
    this._params = {
      startDistance: 500,
      startDensity: 0.0,
      endDistance: 8000,
      endDensity: 0.6,
      color: new Cesium.Color(0.83, 0.83, 0.83, 1.0) // #d4d4d4
    };

    this._createStage();
  }

  // ----- 创建后处理阶段 -----
  _createStage() {
    const fragmentShader = `
                    uniform sampler2D colorTexture;
                    uniform sampler2D depthTexture;
                    uniform vec4 fogByDistance;
                    uniform vec4 fogColor;
                    in vec2 v_textureCoordinates;
                    out vec4 fragColor;

                    // 1. 距离计算函数
                    float getDistance(sampler2D depthTexture, vec2 texCoords) {
                        float depth = czm_unpackDepth(texture(depthTexture, texCoords));
                        if (depth == 0.0) {
                            return czm_infinity;
                        }
                        vec4 eyeCoordinate = czm_windowToEyeCoordinates(gl_FragCoord.xy, depth);
                        return -eyeCoordinate.z / eyeCoordinate.w;
                    }

                    // 2. 距离插值函数
                    float interpolateByDistance(vec4 nearFarScalar, float distance) {
                        float startDistance = nearFarScalar.x;
                        float startValue = nearFarScalar.y;
                        float endDistance = nearFarScalar.z;
                        float endValue = nearFarScalar.w;
                        float t = clamp((distance - startDistance) / (endDistance - startDistance), 0.0, 1.0);
                        return mix(startValue, endValue, t);
                    }

                    // 3. Alpha混合函数
                    vec4 alphaBlend(vec4 sourceColor, vec4 destinationColor) {
                        return sourceColor * vec4(sourceColor.aaa, 1.0) + destinationColor * (1.0 - sourceColor.a);
                    }

                    void main(void) {
                        float distance = getDistance(depthTexture, v_textureCoordinates);
                        vec4 sceneColor = texture(colorTexture, v_textureCoordinates);

                        // 计算雾混合强度
                        float blendAmount = interpolateByDistance(fogByDistance, distance);
                        vec4 finalFogColor = vec4(fogColor.rgb, fogColor.a * blendAmount);

                        fragColor = alphaBlend(finalFogColor, sceneColor);
                    }
                `;

    this._postProcessStage = new Cesium.PostProcessStage({
      name: 'fogEffect',
      fragmentShader: fragmentShader,
      uniforms: {
        fogByDistance: new Cesium.Cartesian4(
          this._params.startDistance,
          this._params.startDensity,
          this._params.endDistance,
          this._params.endDensity
        ),
        fogColor: this._params.color
      }
    });

    this._postProcessStage.enabled = false;
    this._viewer.scene.postProcessStages.add(this._postProcessStage);
  }

  // ----- 控制方法 -----
  enable() {
    if (this._postProcessStage && !this._postProcessStage.enabled) {
      this._postProcessStage.enabled = true;
      this._isEnabled = true;
    }
  }

  disable() {
    if (this._postProcessStage && this._postProcessStage.enabled) {
      this._postProcessStage.enabled = false;
      this._isEnabled = false;
    }
  }

  toggle() {
    if (this._isEnabled) {
      this.disable();
    } else {
      this.enable();
    }
    return this._isEnabled;
  }

  isEnabled() {
    return this._isEnabled;
  }

  // ----- 参数设置 -----
  setStartDistance(value) {
    this._params.startDistance = Math.max(0, value);
    this._updateUniforms();
  }

  setEndDistance(value) {
    this._params.endDistance = Math.max(100, value);
    this._updateUniforms();
  }

  setDensity(value) {
    this._params.endDensity = Math.max(0, Math.min(1.0, value));
    this._updateUniforms();
  }

  setColor(hexColor) {
    const color = Cesium.Color.fromCssColorString(hexColor);
    this._params.color = color;
    if (this._postProcessStage) {
      this._postProcessStage.uniforms.fogColor = color;
    }
  }

  _updateUniforms() {
    if (this._postProcessStage) {
      this._postProcessStage.uniforms.fogByDistance = new Cesium.Cartesian4(
        this._params.startDistance,
        this._params.startDensity,
        this._params.endDistance,
        this._params.endDensity
      );
    }
  }

  // ----- 预设场景 -----
  applyPreset(preset) {
    const presets = {
      light: {
        start: 100,
        end: 3000,
        density: 0.3,
        color: '#e8e8e8'
      },
      moderate: {
        start: 200,
        end: 5000,
        density: 0.5,
        color: '#d4d4d4'
      },
      heavy: {
        start: 50,
        end: 2000,
        density: 0.8,
        color: '#c0c0c0'
      },
      foggy: {
        start: 300,
        end: 8000,
        density: 0.6,
        color: '#b8b8b8'
      }
    };

    const p = presets[preset];
    if (!p) return;

    this.setStartDistance(p.start);
    this.setEndDistance(p.end);
    this.setDensity(p.density);
    this.setColor(p.color);

    if (!this._isEnabled) {
      this.enable();
    }

    return this._params;
  }

  // ----- 销毁 -----
  destroy() {
    if (this._postProcessStage) {
      this._viewer.scene.postProcessStages.remove(this._postProcessStage);
      this._postProcessStage = null;
    }
    this._isEnabled = false;
  }
}

// ================================================================
//  3. 实例化并绑定 UI
// ================================================================

const fogEffect = new FogEffect(viewer);

// DOM 元素
const toggleBtn = document.getElementById('toggleBtn');
const fogStatus = document.getElementById('fogStatus');

const startSlider = document.getElementById('startSlider');
const endSlider = document.getElementById('endSlider');
const densitySlider = document.getElementById('densitySlider');
const colorPicker = document.getElementById('colorPicker');

const startValue = document.getElementById('startValue');
const endValue = document.getElementById('endValue');
const densityValue = document.getElementById('densityValue');

const presetBtns = document.querySelectorAll('.btn-preset');

// ----- 更新状态显示 -----
function updateStatus() {
  const enabled = fogEffect.isEnabled();
  fogStatus.textContent = enabled ? '开启 🌫️' : '关闭';
  fogStatus.className = 'fog-status' + (enabled ? ' active' : '');
  toggleBtn.textContent = enabled ? '⏹ 关闭雾效果' : '🌫️ 开启雾效果';
  toggleBtn.className = 'btn-toggle' + (enabled ? ' active' : '');
}

// ----- 更新滑块显示 -----
function updateSliderDisplay() {
  startValue.textContent = parseInt(startSlider.value);
  endValue.textContent = parseInt(endSlider.value);
  densityValue.textContent = parseFloat(densitySlider.value).toFixed(2);
}

// ----- 滑块事件绑定 -----
startSlider.addEventListener('input', function() {
  const val = parseInt(this.value);
  fogEffect.setStartDistance(val);
  updateSliderDisplay();
});

endSlider.addEventListener('input', function() {
  const val = parseInt(this.value);
  fogEffect.setEndDistance(val);
  updateSliderDisplay();
});

densitySlider.addEventListener('input', function() {
  const val = parseFloat(this.value);
  fogEffect.setDensity(val);
  updateSliderDisplay();
});

// ----- 颜色选择 -----
colorPicker.addEventListener('input', function() {
  fogEffect.setColor(this.value);
});

// ----- 切换按钮 -----
toggleBtn.addEventListener('click', function() {
  fogEffect.toggle();
  updateStatus();
});

// ----- 预设场景 -----
presetBtns.forEach(btn => {
  btn.addEventListener('click', function() {
    const preset = this.dataset.preset;
    const params = fogEffect.applyPreset(preset);

    if (params) {
      startSlider.value = params.startDistance;
      endSlider.value = params.endDistance;
      densitySlider.value = params.endDensity;
      // 尝试从颜色中提取十六进制
      const hex = params.color.toCssColorString();
      if (hex) colorPicker.value = hex;
      updateSliderDisplay();
      updateStatus();
    }
  });
});

// ----- 初始状态 -----
updateStatus();
updateSliderDisplay();

// 窗口 resize
window.addEventListener('resize', () => {
  viewer.resize();
});

console.log('💡 提示: 雾效果基于深度纹理实现，性能开销极低');
</script>
