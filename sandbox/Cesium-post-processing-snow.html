// ================================================================
//  2. 雪效果类（基于 PostProcessStage）
// ================================================================
class SnowEffect {
  constructor(viewer) {
    this._viewer = viewer;
    this._postProcessStage = null;
    this._isEnabled = false;

    // 默认参数
    this._params = {
      intensity: 1.0,
      speed: 1.0,
      opacity: 0.3,
      scale: 5.0,
      color: new Cesium.Color(1.0, 1.0, 1.0, 1.0)
    };

    this._createStage();
  }

  // ----- 创建后处理阶段 -----
  _createStage() {
    const fragmentShader = `
                    uniform sampler2D colorTexture;
                    in vec2 v_textureCoordinates;
                    uniform float snowIntensity;
                    uniform float snowSpeed;
                    uniform float snowOpacity;
                    uniform float snowScale;
                    uniform vec3 snowColor;
                    out vec4 fragColor;

                    // 雪花生成函数
                    float snow(vec2 uv, float scale, float time, float speed) {
                        // 1. 垂直衰减：顶部雪花密度高，底部逐渐消失
                        float w = smoothstep(1.0, 0.0, -uv.y * (scale / 10.0));
                        if (w < 0.1) return 0.0;

                        // 2. 垂直下落动画
                        uv.y += time * speed * 1.5 / scale;

                        // 3. 水平摆动（模拟风力影响）
                        uv.x += sin(uv.y * 1.5 + time * speed) / scale;

                        // 4. 缩放坐标
                        uv *= scale;

                        // 5. 网格划分和伪随机偏移
                        vec2 s = floor(uv), f = fract(uv);
                        float k = 1.0;
                        vec2 p = 0.5 + 0.35 * sin(11.0 * fract(sin((s + scale) * mat2(7, 3, 6, 5)) * 5.0)) - f;

                        // 6. 距离场计算（圆形雪花）
                        float d = length(p);
                        k = smoothstep(0.08, 0.0, d);
                        return k * w;
                    }

                    void main() {
                        float time = czm_frameNumber / 60.0;
                        vec2 resolution = czm_viewport.zw;
                        vec2 uv = (gl_FragCoord.xy * 2.0 - resolution.xy) / min(resolution.x, resolution.y);

                        float c = 0.0;
                        float baseScale = 20.0 / snowScale;

                        // 6层雪花叠加，形成层次感
                        c += snow(uv, baseScale * 0.5, time, snowSpeed) * 0.3;   // 最小雪花
                        c += snow(uv, baseScale * 0.8, time, snowSpeed) * 0.5;   // 较小雪花
                        c += snow(uv, baseScale, time, snowSpeed) * 0.8;         // 中等雪花
                        c += snow(uv, baseScale * 1.2, time, snowSpeed);         // 基准雪花（权重1.0）
                        c += snow(uv, baseScale * 1.5, time, snowSpeed) * 0.7;   // 较大雪花
                        c += snow(uv, baseScale * 2.0, time, snowSpeed) * 0.4;   // 最大雪花

                        vec3 finalColor = snowColor * c * snowIntensity;
                        fragColor = mix(texture(colorTexture, v_textureCoordinates), vec4(finalColor, 1.0), snowOpacity);
                    }
                `;

    this._postProcessStage = new Cesium.PostProcessStage({
      name: 'snowEffect',
      fragmentShader: fragmentShader,
      uniforms: {
        snowIntensity: this._params.intensity,
        snowSpeed: this._params.speed,
        snowOpacity: this._params.opacity,
        snowScale: this._params.scale,
        snowColor: this._params.color
      }
    });

    this._postProcessStage.enabled = false;
    this._viewer.scene.postProcessStages.add(this._postProcessStage);
  }

  // ----- 控制方法 -----
  enable() {
    if (this._postProcessStage && !this._postProcessStage.enabled) {
      this._postProcessStage.enabled = true;
      this._isEnabled = true;
    }
  }

  disable() {
    if (this._postProcessStage && this._postProcessStage.enabled) {
      this._postProcessStage.enabled = false;
      this._isEnabled = false;
    }
  }

  toggle() {
    if (this._isEnabled) {
      this.disable();
    } else {
      this.enable();
    }
    return this._isEnabled;
  }

  isEnabled() {
    return this._isEnabled;
  }

  // ----- 参数设置 -----
  setIntensity(value) {
    this._params.intensity = Math.max(0, Math.min(3.0, value));
    if (this._postProcessStage) {
      this._postProcessStage.uniforms.snowIntensity = this._params.intensity;
    }
  }

  setSpeed(value) {
    this._params.speed = Math.max(0.1, Math.min(3.0, value));
    if (this._postProcessStage) {
      this._postProcessStage.uniforms.snowSpeed = this._params.speed;
    }
  }

  setOpacity(value) {
    this._params.opacity = Math.max(0, Math.min(0.8, value));
    if (this._postProcessStage) {
      this._postProcessStage.uniforms.snowOpacity = this._params.opacity;
    }
  }

  setScale(value) {
    this._params.scale = Math.max(1, Math.min(10, value));
    if (this._postProcessStage) {
      this._postProcessStage.uniforms.snowScale = this._params.scale;
    }
  }

  setColor(r, g, b) {
    this._params.color = new Cesium.Color(r, g, b, 1.0);
    if (this._postProcessStage) {
      this._postProcessStage.uniforms.snowColor = this._params.color;
    }
  }

  // ----- 预设场景 -----
  applyPreset(preset) {
    const presets = {
      light: {
        intensity: 0.5,
        speed: 0.8,
        scale: 3,
        opacity: 0.15
      },
      moderate: {
        intensity: 1.0,
        speed: 1.0,
        scale: 5,
        opacity: 0.3
      },
      heavy: {
        intensity: 2.0,
        speed: 1.2,
        scale: 7,
        opacity: 0.5
      },
      storm: {
        intensity: 3.0,
        speed: 2.0,
        scale: 4,
        opacity: 0.7
      }
    };

    const p = presets[preset];
    if (!p) return;

    this.setIntensity(p.intensity);
    this.setSpeed(p.speed);
    this.setScale(p.scale);
    this.setOpacity(p.opacity);

    if (!this._isEnabled) {
      this.enable();
    }

    return this._params;
  }

  // ----- 销毁 -----
  destroy() {
    if (this._postProcessStage) {
      this._viewer.scene.postProcessStages.remove(this._postProcessStage);
      this._postProcessStage = null;
    }
    this._isEnabled = false;
  }
}

// ================================================================
//  3. 实例化并绑定 UI
// ================================================================

const snowEffect = new SnowEffect(viewer);

// DOM 元素
const toggleBtn = document.getElementById('toggleBtn');
const snowStatus = document.getElementById('snowStatus');

const intensitySlider = document.getElementById('intensitySlider');
const speedSlider = document.getElementById('speedSlider');
const scaleSlider = document.getElementById('scaleSlider');
const opacitySlider = document.getElementById('opacitySlider');

const intensityValue = document.getElementById('intensityValue');
const speedValue = document.getElementById('speedValue');
const scaleValue = document.getElementById('scaleValue');
const opacityValue = document.getElementById('opacityValue');

const presetBtns = document.querySelectorAll('.btn-preset');

// ----- 更新状态显示 -----
function updateStatus() {
  const enabled = snowEffect.isEnabled();
  snowStatus.textContent = enabled ? '开启 ❄️' : '关闭';
  snowStatus.className = 'snow-status' + (enabled ? ' active' : '');
  toggleBtn.textContent = enabled ? '⏹ 关闭雪效果' : '❄️ 开启雪效果';
  toggleBtn.className = 'btn-toggle' + (enabled ? ' active' : '');
}

// ----- 更新滑块显示 -----
function updateSliderDisplay() {
  intensityValue.textContent = parseFloat(intensitySlider.value).toFixed(1);
  speedValue.textContent = parseFloat(speedSlider.value).toFixed(1);
  scaleValue.textContent = parseFloat(scaleSlider.value).toFixed(1);
  opacityValue.textContent = parseFloat(opacitySlider.value).toFixed(2);
}

// ----- 滑块事件绑定 -----
intensitySlider.addEventListener('input', function() {
  const val = parseFloat(this.value);
  snowEffect.setIntensity(val);
  updateSliderDisplay();
});

speedSlider.addEventListener('input', function() {
  const val = parseFloat(this.value);
  snowEffect.setSpeed(val);
  updateSliderDisplay();
});

scaleSlider.addEventListener('input', function() {
  const val = parseFloat(this.value);
  snowEffect.setScale(val);
  updateSliderDisplay();
});

opacitySlider.addEventListener('input', function() {
  const val = parseFloat(this.value);
  snowEffect.setOpacity(val);
  updateSliderDisplay();
});

// ----- 切换按钮 -----
toggleBtn.addEventListener('click', function() {
  snowEffect.toggle();
  updateStatus();
});

// ----- 预设场景 -----
presetBtns.forEach(btn => {
  btn.addEventListener('click', function() {
    const preset = this.dataset.preset;
    const params = snowEffect.applyPreset(preset);

    if (params) {
      intensitySlider.value = params.intensity;
      speedSlider.value = params.speed;
      scaleSlider.value = params.scale;
      opacitySlider.value = params.opacity;
      updateSliderDisplay();
      updateStatus();
    }
  });
});

// ----- 初始状态 -----
updateStatus();
updateSliderDisplay();

// 窗口 resize
window.addEventListener('resize', () => {
  viewer.resize();
});

// ================================================================
