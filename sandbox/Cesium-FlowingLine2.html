function generateSpriteTexture(width, height, colorHex) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');

  const c = Cesium.Color.fromCssColorString(colorHex);
  const r = Math.floor(c.red * 255);
  const g = Math.floor(c.green * 255);
  const b = Math.floor(c.blue * 255);

  const gradient = ctx.createLinearGradient(0, 0, width, 0);
  gradient.addColorStop(0.0, `rgba(${r},${g},${b},0)`);
  gradient.addColorStop(0.3, `rgba(${r},${g},${b},1)`);
  gradient.addColorStop(0.7, `rgba(${r},${g},${b},1)`);
  gradient.addColorStop(1.0, `rgba(${r},${g},${b},0)`);

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, width, height);
  return canvas.toDataURL('image/png');
}

const SPRITE_LINE_TYPE = 'SpriteLine';

const SPRITE_LINE_SOURCE = `
            uniform vec4 baseColor;
            uniform sampler2D image;
            uniform float animationSpeed;

            czm_material czm_getMaterial(czm_materialInput materialInput) {
                czm_material material = czm_getDefaultMaterial(materialInput);
                vec2 st = materialInput.st;

                float time = czm_frameNumber * animationSpeed;
                float s = fract(st.s - time);

                vec4 colorImage = texture(image, vec2(s, st.t));

                material.alpha = colorImage.a;
                material.diffuse = mix(colorImage.rgb, baseColor.rgb, 1.0);
                material.emission = baseColor.rgb * 0.5;

                return material;
            }
        `;

function registerSpriteLineMaterial() {
  try {
    if (Cesium.Material._materialCache._materials &&
      Cesium.Material._materialCache._materials[SPRITE_LINE_TYPE]) {
      return true;
    }
  } catch (e) {}

  try {
    Cesium.Material._materialCache.addMaterial(SPRITE_LINE_TYPE, {
      fabric: {
        type: SPRITE_LINE_TYPE,
        uniforms: {
          baseColor: new Cesium.Color(1.0, 0.84, 0.0, 1.0),
          image: DEFAULT_SPRITE_LINE,
          animationSpeed: 0.01
        },
        source: SPRITE_LINE_SOURCE
      },
      translucent: function() {
        return true;
      }
    });
    console.log('✅ SpriteLine 材质注册成功');
    return true;
  } catch (e) {
    console.error('❌ SpriteLine 材质注册失败:', e);
    return false;
  }
}

/**
 * 生成抛物线轨迹（弧线抬升）
 */
function generateParabolicArc(lng1, lat1, lng2, lat2, height, pointCount) {
  const startPoint = Cesium.Cartesian3.fromDegrees(lng1, lat1, 500);
  const endPoint = Cesium.Cartesian3.fromDegrees(lng2, lat2, 500);

  const result = [];
  const startPos = Cesium.Cartographic.fromCartesian(startPoint);
  const endPos = Cesium.Cartographic.fromCartesian(endPoint);

  const startLon = startPos.longitude * 180 / Math.PI;
  const startLat = startPos.latitude * 180 / Math.PI;
  const endLon = endPos.longitude * 180 / Math.PI;
  const endLat = endPos.latitude * 180 / Math.PI;

  const distance = Math.sqrt(
    (startLon - endLon) * (startLon - endLon) +
    (startLat - endLat) * (startLat - endLat)
  );
  const curvature = distance * 0.5;

  const startVec = Cesium.Cartesian3.clone(startPoint);
  const endVec = Cesium.Cartesian3.clone(endPoint);

  const startLength = Cesium.Cartesian3.distance(startVec, Cesium.Cartesian3.ZERO);
  const endLength = Cesium.Cartesian3.distance(endVec, Cesium.Cartesian3.ZERO);

  Cesium.Cartesian3.normalize(startVec, startVec);
  Cesium.Cartesian3.normalize(endVec, endVec);

  if (Cesium.Cartesian3.distance(startVec, endVec) === 0) return result;

  const omega = Cesium.Cartesian3.angleBetween(startVec, endVec);
  result.push(startPoint);

  for (let i = 1; i < pointCount - 1; i++) {
    const t = i * 1.0 / (pointCount - 1);
    const invT = 1.0 - t;

    const startScalar = Math.sin(invT * omega) / Math.sin(omega);
    const endScalar = Math.sin(t * omega) / Math.sin(omega);

    const startScalarVec = Cesium.Cartesian3.multiplyByScalar(
      startVec, startScalar, new Cesium.Cartesian3()
    );
    const endScalarVec = Cesium.Cartesian3.multiplyByScalar(
      endVec, endScalar, new Cesium.Cartesian3()
    );

    let centerVec = Cesium.Cartesian3.add(startScalarVec, endScalarVec, new Cesium.Cartesian3());

    const theta = t * Math.PI;
    const currentLength = startLength * invT + endLength * t + Math.sin(theta) * height;

    centerVec = Cesium.Cartesian3.multiplyByScalar(centerVec, currentLength, centerVec);
    result.push(centerVec);
  }

  result.push(endPoint);
  return result;
}

/**
 * 生成地平线轨迹（两点直接连线，高度恒定）
 */
function generateFlatArc(lng1, lat1, lng2, lat2, pointCount) {
  const result = [];
  const baseHeight = 1000;

  for (let i = 0; i < pointCount; i++) {
    const t = i / (pointCount - 1);
    const lng = lng1 + (lng2 - lng1) * t;
    const lat = lat1 + (lat2 - lat1) * t;
    // 高度保持不变，形成直线
    result.push(Cesium.Cartesian3.fromDegrees(lng, lat, baseHeight));
  }

  return result;
}

function generateRandomXiAnArc(shapeType) {
  const idx1 = Math.floor(Math.random() * XI_AN_POINTS.length);
  let idx2 = Math.floor(Math.random() * XI_AN_POINTS.length);
  while (idx2 === idx1) {
    idx2 = Math.floor(Math.random() * XI_AN_POINTS.length);
  }

  const p1 = XI_AN_POINTS[idx1];
  const p2 = XI_AN_POINTS[idx2];

  let positions;
  let height;

  if (shapeType === 'parabolic') {
    height = 3000 + Math.random() * 5000;
    const pointCount = 40 + Math.floor(Math.random() * 20);
    positions = generateParabolicArc(p1.lng, p1.lat, p2.lng, p2.lat, height, pointCount);
  } else {
    const pointCount = 30 + Math.floor(Math.random() * 20);
    positions = generateFlatArc(p1.lng, p1.lat, p2.lng, p2.lat, pointCount);
  }

  return {
    positions: positions,
    startName: p1.name,
    endName: p2.name,
    height: height || 0
  };
}

// ================================================================
//  6.1 创建线条
// ================================================================

function createFlowLine(positions, params, mode) {
  const color = Cesium.Color.fromCssColorString(params.color);
  const texture = generateSpriteTexture(256, 4, params.color);

  if (mode === 'primitive') {
    const material = new Cesium.Material({
      fabric: {
        type: SPRITE_LINE_TYPE,
        uniforms: {
          baseColor: color,
          image: texture,
          animationSpeed: params.speed * 0.015
        },
        source: SPRITE_LINE_SOURCE
      }
    });

    const primitive = new Cesium.Primitive({
      geometryInstances: new Cesium.GeometryInstance({
        geometry: new Cesium.PolylineGeometry({
          positions: positions,
          width: params.width,
          vertexFormat: Cesium.VertexFormat.ALL
        })
      }),
      appearance: new Cesium.PolylineMaterialAppearance({
        material: material,
        translucent: true
      })
    });

    viewer.scene.primitives.add(primitive);

    return {
      primitive: primitive,
      material: material,
      type: 'primitive'
    };

  } else {
    registerSpriteLineMaterial();

    const materialProperty = {
      getType: function() {
        return SPRITE_LINE_TYPE;
      },
      getValue: function(time, result) {
        if (!Cesium.defined(result)) result = {};
        result.baseColor = color;
        result.image = texture;
        result.animationSpeed = params.speed * 0.015;
        return result;
      },
      equals: function(other) {
        return this === other;
      },
      isConstant: false,
      definitionChanged: new Cesium.Event()
    };

    const entity = viewer.entities.add({
      polyline: {
        positions: positions,
        width: params.width,
        material: materialProperty,
        clampToGround: false,
        arcType: Cesium.ArcType.NONE
      }
    });

    return {
      entity: entity,
      materialProperty: materialProperty,
      type: 'entity'
    };
  }
}

// ================================================================
//  6.2 添加轨迹
// ================================================================

function addFlowLine() {
  const params = getParams();
  const arcData = generateRandomXiAnArc(currentShape);
  const positions = arcData.positions;

  const result = createFlowLine(positions, params, currentMode);

  const item = {
    ...result,
    positions: positions,
    params: params,
    shape: currentShape,
    mode: currentMode,
    name: arcData.startName + ' → ' + arcData.endName
  };
  lineItems.push(item);

  lineCount++;
  updateStatus(item.name);

  console.log('📌 添加轨迹: ' + item.name + ' | 模式: ' + currentMode + ' | 形状: ' + currentShape +
    ' | 点数: ' + positions.length);
}

// ================================================================
//  6.3 重建所有线条
// ================================================================

function rebuildAllLines() {
  const params = getParams();

  const oldItems = lineItems.slice();
  lineItems = [];

  oldItems.forEach(item => {
    if (item.primitive) {
      viewer.scene.primitives.remove(item.primitive);
    }
    if (item.entity) {
      viewer.entities.remove(item.entity);
    }

    // 根据当前形状重新生成轨迹
    let positions;
    // 从 item.positions 中提取起点和终点
    const startPos = item.positions[0];
    const endPos = item.positions[item.positions.length - 1];
    const startCarto = Cesium.Cartographic.fromCartesian(startPos);
    const endCarto = Cesium.Cartographic.fromCartesian(endPos);

    const lng1 = Cesium.Math.toDegrees(startCarto.longitude);
    const lat1 = Cesium.Math.toDegrees(startCarto.latitude);
    const lng2 = Cesium.Math.toDegrees(endCarto.longitude);
    const lat2 = Cesium.Math.toDegrees(endCarto.latitude);

    if (currentShape === 'parabolic') {
      const height = 3000 + Math.random() * 5000;
      const pointCount = 40 + Math.floor(Math.random() * 20);
      positions = generateParabolicArc(lng1, lat1, lng2, lat2, height, pointCount);
    } else {
      const pointCount = 30 + Math.floor(Math.random() * 20);
      positions = generateFlatArc(lng1, lat1, lng2, lat2, pointCount);
    }

    const result = createFlowLine(positions, params, currentMode);

    const newItem = {
      ...result,
      positions: positions,
      params: params,
      shape: currentShape,
      mode: currentMode,
      name: item.name
    };
    lineItems.push(newItem);
  });

  updateStatus(lineItems.length > 0 ? lineItems[0].name : '');
  console.log('🔄 已重建所有线条 | 模式: ' + currentMode + ' | 形状: ' + currentShape + ' | 线宽: ' + params.width);
}

      if (item.materialProperty.definitionChanged) {
        item.materialProperty.definitionChanged.raiseEvent();
      }
    }
  });
});
