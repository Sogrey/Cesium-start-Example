// ================================================================
//  2. 雨效果类（基于 PostProcessStage）
// ================================================================
class RainEffect {
  constructor(viewer) {
    this._viewer = viewer;
    this._postProcessStage = null;
    this._isEnabled = false;

    // 默认参数
    this._params = {
      intensity: 1.0,
      speed: 1.0,
      direction: -0.4,
      color: new Cesium.Color(0.6, 0.7, 0.8, 1.0),
      opacity: 0.25
    };

    this._createStage();
  }

  // ----- 创建后处理阶段 -----
  _createStage() {
    const fragmentShader = `
                    uniform sampler2D colorTexture;
                    in vec2 v_textureCoordinates;
                    uniform float rainIntensity;
                    uniform float rainSpeed;
                    uniform float rainDirection;
                    uniform vec3 rainColor;
                    uniform float rainOpacity;
                    out vec4 fragColor;

                    float hash(float x) {
                        return fract(sin(x * 23.3) * 13.13);
                    }

                    void main() {
                        float time = czm_frameNumber / 60.0 * rainSpeed;
                        vec2 resolution = czm_viewport.zw;
                        vec2 uv = (gl_FragCoord.xy * 2.0 - resolution.xy) / min(resolution.x, resolution.y);

                        // 雨滴方向旋转
                        float si = sin(rainDirection);
                        float co = cos(rainDirection);
                        uv *= mat2(co, -si, si, co);

                        // 密度分布
                        uv *= length(uv + vec2(0.0, 4.9)) * 0.3 + 1.0;
                        float dropDensity = hash(floor(uv.x * 100.0));
                        float v = 1.0 - sin(dropDensity * 2.0);

                        // 雨滴运动
                        float dropSpeed = 20.0 * rainIntensity;
                        float b = clamp(abs(sin(dropSpeed * time * v + uv.y * (5.0 / (2.0 + v)))) - 0.95, 0.0, 1.0) * 20.0;

                        vec3 rain = rainColor * v * b * rainIntensity;
                        fragColor = mix(texture(colorTexture, v_textureCoordinates), vec4(rain, 1.0), rainOpacity);
                    }
                `;

    this._postProcessStage = new Cesium.PostProcessStage({
      name: 'rainEffect',
      fragmentShader: fragmentShader,
      uniforms: {
        rainIntensity: this._params.intensity,
        rainSpeed: this._params.speed,
        rainDirection: this._params.direction,
        rainColor: this._params.color,
        rainOpacity: this._params.opacity
      }
    });

    this._postProcessStage.enabled = false;
    this._viewer.scene.postProcessStages.add(this._postProcessStage);
  }

  // ----- 控制方法 -----
  enable() {
    if (this._postProcessStage && !this._postProcessStage.enabled) {
      this._postProcessStage.enabled = true;
      this._isEnabled = true;
    }
  }

  disable() {
    if (this._postProcessStage && this._postProcessStage.enabled) {
      this._postProcessStage.enabled = false;
      this._isEnabled = false;
    }
  }

  toggle() {
    if (this._isEnabled) {
      this.disable();
    } else {
      this.enable();
    }
    return this._isEnabled;
  }

  isEnabled() {
    return this._isEnabled;
  }

  // ----- 参数设置 -----
  setIntensity(value) {
    this._params.intensity = Math.max(0, Math.min(2.0, value));
    if (this._postProcessStage) {
      this._postProcessStage.uniforms.rainIntensity = this._params.intensity;
    }
  }

  setSpeed(value) {
    this._params.speed = Math.max(0.1, Math.min(3.0, value));
    if (this._postProcessStage) {
      this._postProcessStage.uniforms.rainSpeed = this._params.speed;
    }
  }

  setDirection(value) {
    this._params.direction = Math.max(-1.2, Math.min(1.2, value));
    if (this._postProcessStage) {
      this._postProcessStage.uniforms.rainDirection = this._params.direction;
    }
  }

  setOpacity(value) {
    this._params.opacity = Math.max(0, Math.min(0.8, value));
    if (this._postProcessStage) {
      this._postProcessStage.uniforms.rainOpacity = this._params.opacity;
    }
  }

  setColor(r, g, b) {
    this._params.color = new Cesium.Color(r, g, b, 1.0);
    if (this._postProcessStage) {
      this._postProcessStage.uniforms.rainColor = this._params.color;
    }
  }

  // ----- 预设场景 -----
  applyPreset(preset) {
    const presets = {
      light: {
        intensity: 0.3,
        speed: 0.8,
        direction: -0.3,
        opacity: 0.12
      },
      moderate: {
        intensity: 0.8,
        speed: 1.0,
        direction: -0.4,
        opacity: 0.25
      },
      heavy: {
        intensity: 1.5,
        speed: 1.3,
        direction: -0.5,
        opacity: 0.4
      },
      storm: {
        intensity: 2.0,
        speed: 2.0,
        direction: -0.6,
        opacity: 0.6
      }
    };

    const p = presets[preset];
    if (!p) return;

    this.setIntensity(p.intensity);
    this.setSpeed(p.speed);
    this.setDirection(p.direction);
    this.setOpacity(p.opacity);

    // 自动开启
    if (!this._isEnabled) {
      this.enable();
    }

    return this._params;
  }

  // ----- 销毁 -----
  destroy() {
    if (this._postProcessStage) {
      this._viewer.scene.postProcessStages.remove(this._postProcessStage);
      this._postProcessStage = null;
    }
    this._isEnabled = false;
  }
}

// ================================================================
//  3. 实例化并绑定 UI
// ================================================================

const rainEffect = new RainEffect(viewer);

// DOM 元素
const toggleBtn = document.getElementById('toggleBtn');
const rainStatus = document.getElementById('rainStatus');

const intensitySlider = document.getElementById('intensitySlider');
const speedSlider = document.getElementById('speedSlider');
const directionSlider = document.getElementById('directionSlider');
const opacitySlider = document.getElementById('opacitySlider');

const intensityValue = document.getElementById('intensityValue');
const speedValue = document.getElementById('speedValue');
const directionValue = document.getElementById('directionValue');
const opacityValue = document.getElementById('opacityValue');

const presetBtns = document.querySelectorAll('.btn-preset');

// ----- 更新状态显示 -----
function updateStatus() {
  const enabled = rainEffect.isEnabled();
  rainStatus.textContent = enabled ? '开启 🌧️' : '关闭';
  rainStatus.className = 'rain-status' + (enabled ? ' active' : '');
  toggleBtn.textContent = enabled ? '⏹ 关闭雨效果' : '🌧️ 开启雨效果';
  toggleBtn.className = 'btn-toggle' + (enabled ? ' active' : '');
}

// ----- 更新滑块显示 -----
function updateSliderDisplay() {
  intensityValue.textContent = parseFloat(intensitySlider.value).toFixed(1);
  speedValue.textContent = parseFloat(speedSlider.value).toFixed(1);
  directionValue.textContent = parseFloat(directionSlider.value).toFixed(1);
  opacityValue.textContent = parseFloat(opacitySlider.value).toFixed(2);
}

// ----- 滑块事件绑定 -----
intensitySlider.addEventListener('input', function() {
  const val = parseFloat(this.value);
  rainEffect.setIntensity(val);
  updateSliderDisplay();
});

speedSlider.addEventListener('input', function() {
  const val = parseFloat(this.value);
  rainEffect.setSpeed(val);
  updateSliderDisplay();
});

directionSlider.addEventListener('input', function() {
  const val = parseFloat(this.value);
  rainEffect.setDirection(val);
  updateSliderDisplay();
});

opacitySlider.addEventListener('input', function() {
  const val = parseFloat(this.value);
  rainEffect.setOpacity(val);
  updateSliderDisplay();
});

// ----- 切换按钮 -----
toggleBtn.addEventListener('click', function() {
  rainEffect.toggle();
  updateStatus();
});

// ----- 预设场景 -----
presetBtns.forEach(btn => {
  btn.addEventListener('click', function() {
    const preset = this.dataset.preset;
    const params = rainEffect.applyPreset(preset);

    // 更新滑块
    if (params) {
      intensitySlider.value = params.intensity;
      speedSlider.value = params.speed;
      directionSlider.value = params.direction;
      opacitySlider.value = params.opacity;
      updateSliderDisplay();
      updateStatus();
    }
  });
});

// ----- 初始状态 -----
updateStatus();
updateSliderDisplay();

// 窗口 resize
window.addEventListener('resize', () => {
  viewer.resize();
});
